<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlowBridge" />

    <!-- SEO -->
    <meta name="description" content="Connect anything. Automate everything." />
    <meta name="keywords" content="automation, workflow, api integration, zapier alternative" />

    <!-- OG -->
    <meta property="og:title"       content="FlowBridge — Workflow Automation" />
    <meta property="og:description" content="Connect anything. Automate everything." />
    <meta property="og:type"        content="website" />

    <title>FlowBridge</title>
      <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('SW registered'))
            .catch(e => console.log('SW failed:', e))
        })
      }
    </script>
  </body>
</html>
